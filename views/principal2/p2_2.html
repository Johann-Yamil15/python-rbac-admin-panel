<link rel="stylesheet" href="/static/css/users/users.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
    /* --- Estilos de Modal Replicados --- */
    .modal-modern {
        max-width: 450px !important;
        padding: 0 !important;
        overflow: hidden;
        border-radius: 20px !important;
        border: none !important;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04) !important;
    }

    .modal-header-custom {
        background: #f8fafc;
        padding: 30px 24px;
        text-align: center;
        border-bottom: 1px solid #f1f5f9;
    }

    .icon-circle {
        width: 60px;
        height: 60px;
        background: #6366f1;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 15px;
        font-size: 24px;
        box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
    }

    .form-body-custom {
        padding: 24px;
    }

    .input-with-icon {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-with-icon i {
        position: absolute;
        left: 15px;
        color: #94a3b8;
    }

    .input-with-icon input {
        padding-left: 45px !important;
        height: 50px;
        border-radius: 12px !important;
        width: 100%;
        border: 1px solid #e2e8f0;
    }

    .modal-actions-custom {
        padding: 20px 24px 30px;
        display: flex;
        gap: 12px;
    }

    .btn-save-modern {
        flex: 2;
        padding: 12px;
        border-radius: 12px;
        background: #6366f1;
        color: white;
        border: none;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        cursor: pointer;
    }

    .btn-cancel-light {
        flex: 1;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        background: white;
        color: #64748b;
        font-weight: 600;
        cursor: pointer;
    }

    /* --- Badges de Estado --- */
    .badge-status {
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
    }

    .badge-active {
        background: #dcfce7;
        color: #166534;
    }

    .badge-inactive {
        background: #fee2e2;
        color: #991b1b;
    }
</style>

<div class="user-dashboard">
    <div class="header-actions">
        <h1>{{ titulo }}</h1>

        <div class="search-section-wrapper">
            <div class="google-pill-container" id="searchPill">
                <div class="main-search-part">
                    <i class="fas fa-search search-icon-muted"></i>
                    <input type="text" id="searchInput" placeholder="Buscar en {{ titulo }}...">
                </div>
                <div class="pill-actions">
                    <button id="btnClearFilters" class="action-circle-btn delete-btn" title="Limpiar">
                        <i class="fas fa-eraser"></i>
                    </button>
                </div>
            </div>
        </div>

        <button id="btnNuevo" class="btn-primary" style="display: none !important;" onclick="openModal()">
            <i class="fas fa-plus"></i> Nuevo
        </button>
    </div>

    <table class="modern-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>NOMBRE / DESCRIPCIÓN</th>
                <th style="text-align: center;">ESTADO</th>
                <th style="text-align: center;">ACCIONES</th>
            </tr>
        </thead>
        <tbody id="tablaGenericaBody"></tbody>
    </table>

    <div class="pagination-container">
        <div class="pagination-controls">
            <button class="btn-page"><i class="fas fa-angle-double-left"></i></button>
            <button class="btn-page"><i class="fas fa-angle-left"></i></button>
            <span class="page-text">Página 1 de 1</span>
            <button class="btn-page"><i class="fas fa-angle-right"></i></button>
            <button class="btn-page"><i class="fas fa-angle-double-right"></i></button>
        </div>
    </div>
</div>

<div id="genericModal" class="modal">
    <div class="modal-content modal-modern">
        <div class="modal-header-custom">
            <div class="icon-circle"><i class="fas fa-folder-plus"></i></div>
            <h2 id="modalTitle">Nuevo Registro</h2>
        </div>
        <form id="genericForm">
            <div class="form-body-custom">
                <div class="form-group-custom">
                    <label class="label-hint">Descripción</label>
                    <div class="input-with-icon">
                        <i class="fas fa-edit"></i>
                        <input type="text" placeholder="Ingrese nombre para {{ titulo }}" required>
                    </div>
                </div>
            </div>
            <div class="modal-actions-custom">
                <button type="button" onclick="closeModal()" class="btn-cancel-light">Cancelar</button>
                <button type="submit" class="btn-save-modern">
                    <span>Guardar Cambios</span>
                    <i class="fas fa-check"></i>
                </button>
            </div>
        </form>
    </div>
</div>

<script id="permisos-data" type="application/json">
{{ permisos_json }}
</script>

<script id="mock-data" type="application/json">
{{ datos_json }}
</script>

<script>
    // Usamos una función para intentar parsear con seguridad
    function safeParse(id) {
        try {
            const element = document.getElementById(id);
            // .textContent es más limpio que .innerHTML para JSON
            return JSON.parse(element.textContent.trim());
        } catch (e) {
            console.error(`Error parseando ${id}:`, e);
            return id === 'mock-data' ? [] : {};
        }
    }

    const permisosBackend = safeParse('permisos-data');
    const datosSimulados = safeParse('mock-data');

    function tienePermiso(valor) {
        return valor === true || valor === 1 || String(valor).toLowerCase() === "true";
    }

    const PERMISOS = {
        canAdd: tienePermiso(permisosBackend.bitAgregar),
        canEdit: tienePermiso(permisosBackend.bitEditar),
        canDelete: tienePermiso(permisosBackend.bitEliminar)
    };

    document.addEventListener('DOMContentLoaded', () => {
        console.log("Datos cargados:", datosSimulados); // DEBUG en consola F12
        console.log("Permisos:", PERMISOS);           // DEBUG en consola F12

        const btnNuevo = document.getElementById('btnNuevo');
        if (PERMISOS.canAdd && btnNuevo) {
            btnNuevo.style.setProperty('display', 'flex', 'important');
        }

        const tbody = document.getElementById('tablaGenericaBody');
        if (!tbody) return;

        if (datosSimulados.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:20px;">No hay datos disponibles</td></tr>`;
            return;
        }

        tbody.innerHTML = datosSimulados.map(fila => `
            <tr>
                <td style="width: 80px;">#${fila.id}</td>
                <td style="font-weight: 500;">${fila.nombre}</td>
                <td style="text-align: center;">
                    <span class="badge-status ${fila.estado === 'Activo' ? 'badge-active' : 'badge-inactive'}">
                        ${fila.estado}
                    </span>
                </td>
                <td style="text-align: center;">
                    <div style="display:flex; justify-content:center; gap:10px;">
                        ${PERMISOS.canEdit ? `
                            <button class="action-circle-btn edit-btn" title="Editar">
                                <i class="fas fa-pen"></i>
                            </button>` : ''}
                        ${PERMISOS.canDelete ? `
                            <button class="action-circle-btn delete-btn" title="Eliminar">
                                <i class="fas fa-trash"></i>
                            </button>` : ''}
                        ${(!PERMISOS.canEdit && !PERMISOS.canDelete) ?
                '<span style="color:#94a3b8; font-size:12px;">Solo lectura</span>' : ''}
                    </div>
                </td>
            </tr>
        `).join('');
    });
</script>
