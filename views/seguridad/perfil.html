<link rel="stylesheet" href="/static/css/users/users.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    /* --- Mejora del Modal de Perfil --- */
.modal-modern {
    max-width: 450px !important;
    padding: 0 !important;
    overflow: hidden;
    border-radius: 20px !important;
    border: none !important;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04) !important;
}

.modal-header-custom {
    background: #f8fafc;
    padding: 30px 24px;
    text-align: center;
    border-bottom: 1px solid #f1f5f9;
}

.icon-circle {
    width: 60px;
    height: 60px;
    background: #6366f1;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    font-size: 24px;
    box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
}

.form-body-custom {
    padding: 24px;
}

/* Input con Icono */
.input-with-icon {
    position: relative;
    display: flex;
    align-items: center;
}

.input-with-icon i {
    position: absolute;
    left: 15px;
    color: #94a3b8;
}

.input-with-icon input {
    padding-left: 45px !important;
    height: 50px;
    border-radius: 12px !important;
}

/* Card de Privilegios */
.admin-privilege-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fdfdff;
    border: 1px solid #e2e8f0;
    padding: 16px;
    border-radius: 16px;
    margin-top: 20px;
    transition: all 0.3s ease;
}

.admin-privilege-card:hover {
    border-color: #6366f1;
    background: #f5f3ff;
}

.card-title {
    display: block;
    font-weight: 700;
    color: #1e293b;
    font-size: 14px;
}

.card-subtitle {
    font-size: 12px;
    color: #64748b;
    margin: 4px 0 0;
}

/* Switch Estilizado */
.switch-custom {
    position: relative;
    display: inline-block;
    width: 50px;
    height: 26px;
}

.switch-custom input { opacity: 0; width: 0; height: 0; }

.slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #cbd5e1;
    transition: .4s;
    border-radius: 34px;
}

.slider:before {
    position: absolute;
    content: "";
    height: 20px; width: 20px;
    left: 3px; bottom: 3px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
}

input:checked + .slider { background-color: #6366f1; }
input:checked + .slider:before { transform: translateX(24px); }

/* Acciones */
.modal-actions-custom {
    padding: 20px 24px 30px;
    display: flex;
    gap: 12px;
}

.btn-cancel-light {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    background: white;
    color: #64748b;
    font-weight: 600;
    cursor: pointer;
}

.btn-save-modern {
    flex: 2;
    padding: 12px;
    border-radius: 12px;
    background: #6366f1;
    color: white;
    border: none;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.2);
}
</style>
<div class="user-dashboard">
    <div class="header-actions">
        <h1>Perfiles</h1>

        <div class="search-section-wrapper">
            <div class="google-pill-container" id="searchPill">
                <div class="main-search-part">
                    <i class="fas fa-search search-icon-muted"></i>
                    <input type="text" id="searchInput" placeholder="Buscar perfil por nombre...">
                </div>
                
                <div class="pill-actions">
                    <button id="btnClearFilters" class="action-circle-btn delete-btn" title="Limpiar">
                        <i class="fas fa-eraser"></i>
                    </button>
                </div>
            </div>
        </div>

        <button id="btnNewPerfil" class="btn-primary" onclick="PerfilManager.openModal()">
            <i class="fas fa-plus"></i> Nuevo
        </button>
    </div>

    <table class="modern-table">
        <thead>
            <tr>
                <th>Nombre del Perfil</th>
                <th>Privilegios de Administrador</th>
                <th style="text-align: center;">Acciones</th>
            </tr>
        </thead>
        <tbody id="perfilTableBody">
            </tbody>
    </table>

    <div class="pagination-container">
        <div class="pagination-controls">
            <button id="btnFirst" class="btn-page"><i class="fas fa-angle-double-left"></i></button>
            <button id="btnPrev" class="btn-page"><i class="fas fa-angle-left"></i></button>
            <span id="currentPageIndicator" class="page-text">Página 1 de 1</span>
            <button id="btnNext" class="btn-page"><i class="fas fa-angle-right"></i></button>
            <button id="btnLast" class="btn-page"><i class="fas fa-angle-double-right"></i></button>
        </div>
    </div>
</div>

<div id="perfilModal" class="modal">
    <div class="modal-content modal-modern">
        <div class="modal-header-custom">
            <div class="icon-circle">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2 id="modalTitle">Nuevo Perfil</h2>
        </div>

        <form id="perfilForm">
            <input type="hidden" name="id">

            <div class="form-body-custom">
                <div class="form-group-custom">
                    <label class="label-hint">Nombre del Perfil</label>
                    <div class="input-with-icon">
                        <i class="fas fa-id-card"></i>
                        <input type="text" name="strNombrePerfil" id="strNombrePerfil" placeholder="Ej: Administrador" required>
                    </div>
                </div>

                <div class="admin-privilege-card">
                    <div class="card-info">
                        <span class="card-title">Privilegios de Administrador</span>
                        <p class="card-subtitle">Permite acceso total a todas las funciones del sistema.</p>
                    </div>
                    <label class="switch-custom">
                        <input type="checkbox" name="bitAdministrador" id="bitAdministrador">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="modal-actions-custom">
                <button type="button" onclick="PerfilManager.closeModal()" class="btn-cancel-light">
                    Cancelar
                </button>
                <button type="submit" class="btn-save-modern">
                    <span>Guardar Cambios</span>
                    <i class="fas fa-check"></i>
                </button>
            </div>
        </form>
    </div>
</div>

<div id="deleteModal" class="modal">
    <div class="modal-content confirm-delete">
        <div class="warn-icon" style="font-size: 50px; margin-bottom: 15px;">⚠️</div>
        <h2>¿Estás seguro?</h2>
        <p>Esta acción no se puede deshacer. Se eliminará el perfil permanentemente del sistema.</p>
        <div class="modal-actions" style="justify-content: center;">
            <button type="button" onclick="PerfilManager.closeDeleteModal()" class="btn-secondary">No, cancelar</button>
            <button type="button" id="confirmDeleteBtn" class="btn-danger">Sí, eliminar</button>
        </div>
    </div>
</div>

<script id="permisos-data" type="application/json">
    {{permisos_json}}
</script>

<script>
    const jsonString = document.getElementById('permisos-data').textContent;
    const permisosBackend = JSON.parse(jsonString);
    
    console.log("🔍 DATA CRUDA DEL BACKEND (Perfiles):", permisosBackend);

    // Función auxiliar de seguridad
    function tienePermiso(valor) {
        return valor === true || valor === 1 || valor === "true" || valor === "True";
    }

    // Mapeamos los permisos globalmente para este módulo
    const PERMISOS_MODULO = {
        canAdd: tienePermiso(permisosBackend.bitAgregar),
        canEdit: tienePermiso(permisosBackend.bitEditar),
        canDelete: tienePermiso(permisosBackend.bitEliminar)
    };

    console.log("✅ Permisos mapeados correctamente (Perfiles):", PERMISOS_MODULO);
</script>

<script src="/static/js/perfiles/perfiles.js"></script>
